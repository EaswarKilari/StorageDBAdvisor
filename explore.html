<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore Databases</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Explore Databases</h1>
    <p class="tagline">Pick any database to see its full property sheet.</p>
    <nav class="nav">
      <a href="index.html">&#8592; Recommender</a>
      <a href="explore.html" class="active">Explore properties</a>
    </nav>
  </header>

  <main>
    <section class="panel knobs">
      <h2>Choose a database</h2>
      <div class="field">
        <label for="dbPicker">Database</label>
        <p class="hint">Select from the full catalog to view its storage structure, workloads, consistency, scaling, and more.</p>
        <select id="dbPicker"></select>
      </div>
    </section>

    <section class="panel" id="detail"></section>
  </main>

  <script src="catalog.js"></script>
  <script src="explore.js"></script>
</body>
</html>
